version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/openai-agents-sdk"
      - "/pydantic-ai"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "slack-*"
    labels:
      - "pip"
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

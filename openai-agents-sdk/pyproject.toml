[project]
name = "bolt-python-coding-agent-openai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiohttp==3.14.5",
    "openai-agents==0.24.0",
    "python-dotenv==1.2.4",
    "slack-bolt==1.30.0",
    "slack-cli-hooks==0.3.0",
    "slack-sdk==3.46.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
dev = [
    "bolt-python-coding-agent-openai[test]",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
include = ["agent*", "listeners*"]

[tool.ruff]
[tool.ruff.lint]
[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

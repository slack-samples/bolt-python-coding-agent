[project]
name = "bolt-python-coding-agent-pydantic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.14.5",
    "pydantic-ai-slim[anthropic,openai]==2.57.0",
    "python-dotenv==1.2.4",
    "slack-bolt==1.30.0",
    "slack-cli-hooks==0.3.0",
    "slack-sdk==3.45.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
dev = [
    "bolt-python-coding-agent-pydantic[test]",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["agent*", "listeners*"]

[tool.ruff]
[tool.ruff.lint]
# Keep `asyncio.TimeoutError`, like the other implementations that still run on Python 3.10.
ignore = ["UP041"]
[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
